<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">UI Compare 隐私政策 — 中英双语，本地优先，零追踪</title>
  <desc id="desc">浅色纸面底标题：UI Compare 隐私政策，副标题本地优先，数据不出浏览器；右侧是盾牌图标与本地存储示意，设计图与比较上下文只存在 IndexedDB 里。</desc>

  <rect width="1200" height="360" rx="26" fill="#f8f9fa"/>

  <g id="paper-lines" stroke="#e8eaed" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#5f6368">CHROME 扩展 · 中英双语 · BILINGUAL POLICY</text>
    <text x="56" y="128" font-size="56" font-weight="700" fill="#202124">UI Compare 隐私政策</text>
    <text x="56" y="168" font-size="23" fill="#3c4043">PRIVACY POLICY — 本地优先，数据不出浏览器</text>
    <text x="56" y="204" font-size="19" fill="#5f6368">UI Compare Chrome 扩展的公开隐私政策，英文与中文同页。</text>
    <g id="chips" font-size="18" fill="#202124" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/><text x="119" y="262">中英双语</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/><text x="257" y="262">本地优先</text></g>
      <g><rect x="332" y="238" width="108" height="36" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/><text x="386" y="262">零追踪</text></g>
      <g><rect x="452" y="238" width="150" height="36" rx="18" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/><text x="527" y="262">单文件静态页</text></g>
    </g>
  </g>

  <g id="shield-diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="shield" transform="translate(820 180)">
      <path d="M0 -110 L88 -78 V10 C88 70 48 104 0 122 C-48 104 -88 70 -88 10 V-78 Z" fill="#1a73e8" opacity="0.12" stroke="#1a73e8" stroke-width="2.5"/>
      <path d="M-34 6 L-12 28 L38 -26" fill="none" stroke="#1a73e8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="local-box">
      <g><rect x="950" y="96" width="150" height="52" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/><text x="1025" y="118" font-size="18" fill="#202124" text-anchor="middle">设计图 + 设置</text><text x="1025" y="140" font-size="16" fill="#5f6368" text-anchor="middle">存 IndexedDB</text></g>
      <g><rect x="950" y="164" width="150" height="52" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/><text x="1025" y="186" font-size="18" fill="#202124" text-anchor="middle">activeTab</text><text x="1025" y="208" font-size="16" fill="#5f6368" text-anchor="middle">触发后才临时访问</text></g>
      <g><rect x="950" y="232" width="150" height="52" rx="10" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/><text x="1025" y="254" font-size="18" fill="#202124" text-anchor="middle">导出 / 导入</text><text x="1025" y="276" font-size="16" fill="#5f6368" text-anchor="middle">本地完成，不上传</text></g>
    </g>
    <text x="1025" y="322" font-size="18" fill="#5f6368" text-anchor="middle">无服务器 · 无分析 · 无广告 · 无账号</text>
  </g>
</svg>
